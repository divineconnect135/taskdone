<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Done | Project Management</title>
    <link
      rel="shortcut icon"
      href="/taskdone-favicon.ico"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="./styles/output.css" />
    <script type="module" src="./js/main.js" defer></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 p-6">
      <h1 class="text-2xl font-bold text-slate-900">TaskDone</h1>
      <p class="text-slate-500">Organize your work efficiently.</p>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-6 py-8">
      <!-- Board Header -->
      <div class="mb-8 flex flex-wrap items-center justify-between gap-4">
        <div>
          <h2 class="text-2xl font-bold">Project Board</h2>
          <p class="mt-1 text-sm text-slate-500">
            "Organize and Track your Tasks"
          </p>
        </div>
        <button
          id="add-task-btn"
          type="button"
          class="rounded-lg bg-indigo-600 px-5 py-3 font-medium text-white transition hover:bg-indigo-700 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
        >
          + Add Task
        </button>
      </div>

      <!-- Task Statistics -->
      <section class="mb-8 grid grid-cols-2 gap-4 lg:grid-cols-4">
        <!-- Total Tasks  -->
        <div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
          <p class="text-sm text-slate-500">Total Tasks</p>
          <h3 id="stat-total" class="mt-2 text-3xl font-bold text-indigo-600">
            0
          </h3>
        </div>
        <!-- To Do -->
        <div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
          <p class="text-sm text-slate-500">To Do</p>

          <h3 id="stat-todo" class="mt-2 text-3xl font-bold text-slate-700">
            0
          </h3>
        </div>
        <!-- In Progress -->
        <div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
          <p class="text-sm text-slate-500">In Progress</p>

          <h3 id="stat-progress" class="mt-2 text-3xl font-bold text-amber-600">
            0
          </h3>
        </div>
        <!-- Completed -->
        <div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
          <p class="text-sm text-slate-500">Completed</p>

          <h3 id="stat-done" class="mt-2 text-3xl font-bold text-green-600">
            0
          </h3>
        </div>
      </section>
      <!-- Search and Filters -->
      <section
        aria-label="Task filters"
        class="mb-8 rounded-xl border border-slate-200 bg-white p-5 shadow-sm"
      >
        <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
          <!-- Search -->
          <div>
            <label for="search-input" class="mb-2 block text-sm font-medium">
              Search Tasks
            </label>

            <input
              id="search-input"
              type="search"
              placeholder="Search by task title..."
              class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:border-indigo-500 focus:outline-none"
            />
          </div>

          <!-- Priority Filter -->
          <div>
            <label for="priority-filter" class="mb-2 block text-sm font-medium">
              Priority
            </label>

            <select
              id="priority-filter"
              class="w-full rounded-lg border border-slate-300 px-4 py-3"
            >
              <option value="all">All Priorities</option>

              <option value="High">High</option>

              <option value="Medium">Medium</option>

              <option value="Low">Low</option>
            </select>
          </div>

          <!-- Due Date Filter -->
          <div>
            <label for="date-filter" class="mb-2 block text-sm font-medium">
              Due On or Before
            </label>

            <input
              id="date-filter"
              type="date"
              class="w-full rounded-lg border border-slate-300 px-4 py-3"
            />
          </div>
        </div>

        <div class="mt-4 flex items-center justify-between gap-4">
          <p
            id="filter-count"
            class="text-sm text-slate-500"
            aria-live="polite"
          >
            Showing all tasks
          </p>

          <button
            id="clear-filters-btn"
            type="button"
            class="rounded-lg px-4 py-2 text-sm font-medium text-indigo-600 hover:bg-indigo-50"
          >
            Clear Filters
          </button>
        </div>
      </section>

      <!-- Kanban Board  -->
      <section
        id="kanban-board"
        aria-label="Kanban Board"
        class="grid grid-cols-1 gap-6 md:grid-cols-3"
      >
        <!-- TO DO  -->
        <section data-status="todo" class="min-w-0 rounded-xl bg-slate-100 p-4">
          <h3 class="mb-5 font-semibold">To Do</h3>
          <div id="todo-tasks" class="space-y-4"></div>
        </section>

        <!-- In Progress  -->
        <section
          data-status="progress"
          class="min-w-0 rounded-xl bg-slate-100 p-4"
        >
          <h3 class="mb-5 font-semibold">In Progress</h3>
          <div id="progress-tasks" class="space-y-4"></div>
        </section>

        <!-- DONE  -->
        <section data-status="done" class="min-w-0 rounded-xl bg-slate-100 p-4">
          <h3 class="mb-5 font-semibold">Done</h3>
          <div id="done-tasks" class="space-y-4"></div>
        </section>
      </section>
    </main>

    <!-- Add Task Dialog  -->

    <dialog
      id="task-dialog"
      class="m-auto w-[min(92vw,32rem)] max-h-[90vh] overflow-y-auto rounded-2xl p-0 shadow-2xl backdrop:bg-slate-900/60"
    >
      <div class="border-b border-slate-200 p-6">
        <h2 class="text-xl font-bold">Create New Task</h2>
        <p class="mt-1 text-sm text-slate-500">Add a new task to your board</p>
      </div>

      <form id="task-form" class="space-y-5 p-6">
        <!-- Task Tittle -->
        <div>
          <label for="task-title" class="mb-2 block text-sm font-medium">
            Task Title
          </label>

          <input
            type="text"
            name="title"
            id="task-title"
            required
            maxlength="100"
            placeholder="Enter Your Task Title"
            class="w-full rounded-lg border border-slate-300 p-3 focus:border-indigo-500 focus:outline-none"
          />
        </div>

        <!-- Description  -->
        <div>
          <label for="task-description" class="mb-2 block text-sm font-medium">
            Description
          </label>

          <textarea
            name="description"
            id="task-description"
            rows="3"
            required
            maxlength="500"
            placeholder="Enter Your Description"
            class="w-full rounded-lg border border-slate-300 p-3 focus:border-indigo-500 focus:outline-none"
          ></textarea>
        </div>

        <!-- Priority -->
        <div>
          <label for="task-priority" class="mb-2 block text-sm font-medium">
            Priority
          </label>

          <select
            id="task-priority"
            name="priority"
            required
            class="w-full rounded-lg border border-slate-300 p-3"
          >
            <option value="" disabled selected>Select priority</option>

            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>
        </div>
        <!-- Due Date -->
        <div>
          <label for="task-date" class="mb-2 block text-sm font-medium">
            Due Date
          </label>

          <input
            id="task-date"
            name="dueDate"
            type="date"
            required
            class="w-full rounded-lg border border-slate-300 p-3"
          />
        </div>

        <!-- Validation Error -->
        <p
          id="task-form-error"
          role="alert"
          class="hidden text-sm text-red-600"
        ></p>

        <!-- Buttons -->
        <div class="flex justify-end gap-3 pt-4">
          <button
            id="cancel-task-btn"
            type="button"
            class="rounded-lg bg-slate-100 px-5 py-3 hover:bg-slate-200"
          >
            Cancel
          </button>

          <button
            type="submit"
            class="rounded-lg bg-indigo-600 px-5 py-3 text-white hover:bg-indigo-700"
          >
            Create Task
          </button>
        </div>
      </form>
    </dialog>
  </body>
</html>
